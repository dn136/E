const cat = (...a)=>{const r=new Uint8Array(a.reduce((n,x)=>n+x.length,0));let o=0;a.forEach(x=>{r.set(x,o);o+=x.length});return r;};
function fkey(pw,s){let x=cat(s,U(pw));for(let i=0;i<30000;i++)x=sha256(x);return x;}
function fx(k,t){const o=new Uint8Array(t.length);for(let i=0;i*32<t.length;i++){const ks=sha256(cat(k,new Uint8Array([i>>8,i&255])));for(let j=0;j<32&&i*32+j<t.length;j++)o[i*32+j]=t[i*32+j]^ks[j];}return o;}
function fenc(t,pw){const s=crypto.getRandomValues(new Uint8Array(16)),k=fkey(pw,s),ct=fx(k,U(t)),m=sha256(cat(k,U('mac'),ct)).slice(0,16);return btoa(String.fromCharCode(...cat(s,m,ct)));}
function fdec(b64,pw){const d=Uint8Array.from(atob(b64),c=>c.charCodeAt(0)),s=d.slice(0,16),mac=d.slice(16,32),ct=d.slice(32),k=fkey(pw,s),m=sha256(cat(k,U('mac'),ct)).slice(0,16);if(m.some((v,i)=>v!=mac[i]))throw new Error('bad key');return new TextDecoder().decode(fx(k,ct));}
const sha = async s => [...sha256(U(norm(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');

async function dec0(b64,pw){
  const d=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d.slice(0,16),iterations:100000,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:d.slice(16,28)},k,d.slice(28)));
}
async function dec(s,pw){
  if(!s) return '';
  if(!s.includes('|')){
    return fdec(s, pw);
  }
  const[a,f]=s.split('|');
  if(window.crypto&&crypto.subtle){try{return await dec0(a,pw);}catch(e){}}
  return fdec(f,pw);
}

let ACT=91;
function radar(cv){
  const x=cv.getContext('2d'),W=cv.width=cv.clientWidth*2||520;
  cv.height=W;
  const R=W/2-6,c=W/2;
  const D=Array.from({length:60},()=>({a:Math.random()*6.283,r:Math.sqrt(Math.random())*.92,b:0,id:Math.random()}));
  let t=0;
  (function f(){
    if(!cv.isConnected)return;
    t+=.022;
    x.clearRect(0,0,W,W);
    x.strokeStyle='rgba(61,255,154,.28)';x.lineWidth=2;
    for(let i=1;i<=4;i++){x.beginPath();x.arc(c,c,R*i/4,0,6.283);x.stroke();}
    x.beginPath();x.moveTo(c-R,c);x.lineTo(c+R,c);x.moveTo(c,c-R);x.lineTo(c,c+R);x.stroke();
    const sw=t%6.283;
    for(let i=0;i<40;i++){
      x.strokeStyle=`rgba(61,255,154,${.5*(1-i/40)})`;
      x.beginPath();x.moveTo(c,c);x.lineTo(c+Math.cos(sw-i*.018)*R,c+Math.sin(sw-i*.018)*R);x.stroke();
    }
    D.forEach(p=>{
      if(p.id*100>ACT)return;
      let da=(sw-p.a+12.566)%6.283;
      if(da<.06)p.b=1;
      p.b=Math.max(0,p.b-.008);
      if(p.b>0){
        x.fillStyle=`rgba(${ACT<30?'61,255,154':'255,70,96'},${p.b})`;
        x.beginPath();x.arc(c+Math.cos(p.a)*p.r*R,c+Math.sin(p.a)*p.r*R,6,0,6.283);x.fill();
      }
    });
    requestAnimationFrame(f);
  })();
}

    [...$('#tb').children].forEach(b=>b.classList.toggle('on',b.textContent==n));
    $('#ct').innerHTML=T[n]();
    const pc=$('#pc');
    if(pc){pc.textContent=pr;$('#cp').onclick=e=>{try{navigator.clipboard.writeText(pr);e.target.textContent='скопировано';}catch(x){}};}
    const pl=$('#pl');
    if(pl)pl.onclick=()=>{
      $('#eq').classList.add('play');
      [330,330,349,392,330].forEach((f,i)=>setTimeout(()=>beep(f),i*350));
      setTimeout(()=>$('#eq')&&$('#eq').classList.remove('play'),1900);
    };
  };
  Object.keys(T).forEach(n=>{
    const b=document.createElement('button');
    b.className='btn';b.textContent=n;
    b.onclick=()=>show(n);
    $('#tb').append(b);
  });
  show('Голуби');
}

function cons(){
  const pw=['mos','mel','con','pil'].map(x=>S.k[x]).join('|');
  const initMsg = S.done
    ? 'Сеть «Карниз»: импульс уже запущен. Активность 2%.'
    : 'Сеть «Карниз»: доступ получен.';
  view(`<div class="panel term">
    <div class="tb"><i></i><i></i><i></i><span>root@карниз:~</span></div>
    <div class="out" id="o1"><div class="k">${initMsg}</div></div>
    <div class="ln"><span class="pr">$</span><input id="ci" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="команда"></div>
    <div class="chipsrow" style="padding:0 14px 14px">
      <button class="chip" data-c="status">status</button>
    </div>
  </div>${back}`);
  const o1=$('#o1'),ci=$('#ci');
  const out=(t,c)=>{
    const d=document.createElement('div');
    if(c)d.className=c;
    d.textContent=t;
    o1.append(d);
    o1.scrollTop=o1.scrollHeight;
  };
  const run=async c=>{
    const v=norm(c);
    ci.value='';
    if(!c.trim())return;
    out('$ '+c,'u');

    if(v === 'PULSESTARTFREQ=330POWER=MAX') {
      executeDeepScanOverride(pw);
      return;
    }

    if(v==='STATUS')
      out(S.done
        ? 'Сеть «Карниз»: активность 2%. Импульс запущен.'
        : 'Сеть «Карниз»: активность 91%. Импульс не запущен.');
    else if(await sha(c)===H.cmd){
      if(S.done)
        out('Импульс уже запущен. Активность сети: 2%.','k');
      else
        launch(pw);
    }
    else if(v.startsWith('PULSESTART')){
      out('Параметры не совпадают с сигналом сети. Импульс игнорируется.','e');
      vib(60);
    }
    else out('Неизвестная команда.','e');
  };
  ci.onkeydown=e=>{if(e.key==='Enter')run(ci.value);};
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>run(b.dataset.c));
}

async function launch(pw){
  S.done=1; save();
  document.body.classList.add('alert');
  vib([100,50,100]);
  ACT=100;
  view(`<div class="panel launch center"><h2 class="gl">Импульс запущен</h2><canvas class="radar" id="rd"></canvas><div class="num" id="av">100%</div><small>активность сети «Карниз»</small><svg class="gr" id="gr" viewBox="0 0 300 120" preserveAspectRatio="none"><polygon id="pg" fill="rgba(255,70,96,.25)"/><polyline id="pl" fill="none" stroke="#ff4660" stroke-width="2"/></svg><div class="out" id="lg" style="text-align:left"></div><div id="fin"></div></div>`);
  radar($('#rd'));
  const L={3:'Импульс излучён.',14:'Потеряно 40% узлов.',26:'Связь с 190 городами потеряна.',40:'Компас сбит.',52:'Сеть «Карниз» не отвечает.'};
  let pts=[];
  for(let i=0;i<=60;i++){
    await sleep(140);
    const v=Math.max(2,100*Math.exp(-i/14)+Math.random()*5);
    ACT=v;
    pts.push(`${i*5},${118-v*1.1}`);
    $('#pl').setAttribute('points',pts.join(' '));
    $('#pg').setAttribute('points',pts.join(' ')+` ${i*5},120 0,120`);
    if(v<40){
      $('#pl').setAttribute('stroke','#3dff9a');
      $('#pg').setAttribute('fill','rgba(61,255,154,.2)');
      $('#av').classList.add('low');
    }
    $('#av').textContent=Math.round(v)+'%';
    if(i%6==0)beep(200+(60-i)*6,.05,.1);
    if(L[i]){
      const d=document.createElement('div');
      d.textContent=new Date().toTimeString().slice(0,8)+' '+L[i];
      $('#lg').append(d);
      $('#lg').scrollTop=1e4;
    }
  }
  document.body.classList.remove('alert');
  vib([60,40,60,40,200]);
  [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.15,.4),i*160));
  
  let ph='';
  try{ph=await dec(DATA.phone,pw);}catch(e){}
  $('#fin').innerHTML=`<div class="final">
    <h2>Импульс запустился успешно.</h2>
    <div class="box" id="phb">${ph}</div>
    <p class="err">Обнаружен вирус в системе!</p>
    <button class="btn" data-act="end" style="margin-top:14px">▶ Открыть архив</button>
    <button class="btn ghost" data-act="hub">‹ В панель</button>
  </div>`;
}

async function executeDeepScanOverride(pw) {
  document.body.classList.add('alert');
  vib([100,50,100]);
  ACT=100;
  view(`<div class="panel launch center"><h2 class="gl">Импульс запущен</h2><canvas class="radar" id="rd"></canvas><div class="num" id="av">100%</div><small>активность сети «Карниз»</small><svg class="gr" id="gr" viewBox="0 0 300 120" preserveAspectRatio="none"><polygon id="pg" fill="rgba(255,70,96,.25)"/><polyline id="pl" fill="none" stroke="#ff4660" stroke-width="2"/></svg><div class="out" id="lg" style="text-align:left"></div><div id="fin"></div></div>`);
  radar($('#rd'));
  let pts=[];
  
  for(let i=0;i<=20;i++){
    await sleep(80);
    const v = 100 - (26 * (i/20));
    ACT=v;
    pts.push(`${i*5},${118-v*1.1}`);
    $('#pl').setAttribute('points',pts.join(' '));
    $('#pg').setAttribute('points',pts.join(' ')+` ${i*5},120 0,120`);
    $('#av').textContent=Math.round(v)+'%';
    beep(300 - i*5, .05, .1);
  }

  const secFlags = [
    "ВНИМАНИЕ: ОБНАРУЖЕНА ПОДОЗРИТЕЛЬНАЯ АВТОРИЗАЦИЯ",
    "СИСТЕМА ЗАФИКСИРОВАЛА СЛЕДЫ ИСПОЛЬЗОВАНИЯ НЕЙРОСЕТЕЙ",
    "КРИТИЧЕСКАЯ УГРОЗА: ПОПЫТКА ОБХОДА СИСТЕМЫ БЕЗОПАСНОСТИ",
    "АВАРИЙНОЕ ЗАВЕРШЕНИЕ ПРОТОКОЛА ЗАЩИТЫ",
    "СИСТЕМА: ДОСТУП ЗАПРЕЩЕН. ВКЛЮЧЕНА ОЧИСТКА ДАННЫХ",
    "WARNING: AI TRACE DETECTED. DATA WIPE INITIATED",
    "ОШИБКА БЕЗОПАСНОСТИ №9941"
  ];

  for(let i=0; i<18; i++){
    setTimeout(() => {
      const m = document.createElement('div');
      m.className = 'sys-alert';
      m.style.left = Math.random() * 80 + 'vw';
      m.style.top = Math.random() * 80 + 'vh';
      m.innerHTML = `<h3>⚠️ СБОЙ СИСТЕМЫ</h3><p>${secFlags[Math.floor(Math.random()*secFlags.length)]}</p>`;
      document.body.appendChild(m);
      beep(140 + Math.random()*100, .1, .15);
      vib(30);
    }, i * 120);
  }

  await sleep(2800);

  const sysPurgeOverlay = document.createElement('div');
  sysPurgeOverlay.style.cssText = 'position:fixed;inset:0;background:rgba(5,8,7,0.96);z-index:10001;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--red);font-family:var(--mo);';
  sysPurgeOverlay.innerHTML = `
    <h1 style="font-family:var(--hd);font-size:32px;animation:gl 1s infinite;margin-bottom:20px;text-shadow:0 0 20px currentColor;">ОЧИСТКА ДАННЫХ...</h1>
    <div style="width:60%;max-width:400px;height:30px;border:2px solid var(--red);position:relative;background:#000;">
      <div id="wipe-bar" style="height:100%;width:0%;background:var(--red);transition:width 0.3s;"></div>
    </div>
    <h2 id="wipe-percent" style="margin-top:20px;font-size:24px;">0%</h2>
    <small style="margin-top:10px;color:var(--dim);">Поиск подозрительных ИИ-паттернов...</small>
  `;
  document.body.appendChild(sysPurgeOverlay);

  for(let i=1; i<=7; i++){
    await sleep(350);
    document.getElementById('wipe-bar').style.width = (i*10) + '%';
    document.getElementById('wipe-percent').textContent = (i*1) + '%';
    beep(100, 0.3, 0.2);
  }

  await sleep(2000);
  document.getElementById('wipe-percent').textContent = "ОШИБКА: Вероятность ложного срабатывания 99.9%";
  document.getElementById('wipe-percent').style.fontSize = "18px";
  document.getElementById('wipe-percent').style.color = "var(--g)";
  beep(600, 0.2, 0.4);
  await sleep(1500);
  
  document.getElementById('wipe-percent').textContent = "ОТМЕНА ОЧИСТКИ. ДОБРО ПОЖАЛОВАТЬ, АГЕНТ.";
  await sleep(2000);

  document.querySelectorAll('.sys-alert').forEach(el => el.remove());
  sysPurgeOverlay.remove();
  document.body.classList.remove('alert');
  ACT=91; 
  
  vib([60,40,60,40,200]);
  [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.15,.4),i*160));
  
  cons();
}

</script></body></html>
